<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the colour field runs under the notch; the content keeps clear of it with env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2340e0" />
    <meta name="description" content="A daily song-guessing game: hear a sliver of a song and name it." />
    <title>Needledrop</title>
    <script>
      // Before the first paint: today's sleeve by the UTC weekday. The app corrects it from the game's own day.
      document.documentElement.dataset.sleeve = String(new Date().getUTCDay())
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
