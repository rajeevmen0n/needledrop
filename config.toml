# Needledrop server settings. The file is read from the working directory;
# `GTS_CONFIG` points the server at another path.

# `GTS_BIND` overrides this.
bind = "127.0.0.1:4810"

# Cached previews, the cookie key and the database live here (git-ignored).
data_dir = "data"

# Day 1 of the game, as a UTC date; the day number counts from it.
launch_date = "2026-10-01"

# The one song the server plays, every day, until the daily pick from the
# playlists below is built. A Deezer track ID; `GTS_TRACK_ID` overrides it.
track_id = 136889400

# Public Deezer playlists the daily song will be drawn from. Not read yet.
# Tracks that are not readable or have no preview are dropped when the pool is
# loaded. Counts checked on 2026-10-01 from this server (Deezer sees it as US).
playlists = [
  11535307124, # "Rolling Stone: Best Songs of All Time" — 493 tracks, 290 playable (59%)
  5123717724,  # "Most Popular Songs of All Time: Greatest Hits [Upd…" — 501 tracks, 356 playable (71%)
]

# Where the song pool and the players' games are kept. "sqlite" (the default
# when this table is left out) is one file, needledrop.db, under data_dir: the
# server creates it and puts six seed songs into an empty pool. "memory" keeps
# nothing between starts, so every restart forgets every player's games.
# This table stays at the end of the file, because every key written after a
# table header belongs to that table.
[store]
kind = "sqlite"
