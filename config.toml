# Needledrop server settings. `GTS_BIND` overrides `bind`.

bind = "127.0.0.1:4810"

# Daily pick history, cached previews and the cookie key live here (git-ignored).
data_dir = "data"

# Day 1 of the game, as a UTC date; the day number counts from it.
launch_date = "2026-10-01"

# Public Deezer playlists the daily song is drawn from. Tracks that are not
# readable or have no preview are dropped when the pool is loaded.
# Counts checked on 2026-10-01 from this server (Deezer sees it as US).
playlists = [
  11535307124, # "Rolling Stone: Best Songs of All Time" — 493 tracks, 290 playable (59%)
  5123717724,  # "Most Popular Songs of All Time: Greatest Hits [Upd…" — 501 tracks, 356 playable (71%)
]
