# Needledrop server settings. The file is read from the working directory;
# `GTS_CONFIG` points the server at another path.

# `GTS_BIND` overrides this.
bind = "127.0.0.1:4810"

# Cached previews, the cookie key and the database live here (git-ignored).
data_dir = "data"

# Day 1 of the game, as a UTC date; the day number counts from it, and the
# admin's "Reset to day 1" goes back to it.
launch_date = "2026-10-01"

# Where the song pool, the players' games, the daily picks and the day offset
# are kept. "sqlite" (the default when this table is left out) is one file,
# needledrop.db, under data_dir: the server creates it and puts six seed songs
# into an empty pool. "memory" keeps nothing between starts, so every restart
# forgets every player's games and draws the day's songs again.
# This table stays at the end of the file, because every key written after a
# table header belongs to that table.
[store]
kind = "sqlite"
