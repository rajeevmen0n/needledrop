# bacon restarts the server when its sources change (`just dev`).
# It runs from the repo root so the default `data/` directory resolves here.

default_job = "server"

[jobs.server]
command = ["cargo", "run", "--manifest-path", "server/Cargo.toml"]
watch = ["server/src", "server/Cargo.toml"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
